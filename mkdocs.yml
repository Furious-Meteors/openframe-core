site_name: openframe-core — Technical Docs
site_description: Architecture, module reference, operations, and developer guide for openframe-core
site_author: Furious Meteors Engineering
site_url: https://furious-meteors.github.io/openframe-core/
repo_name: Furious-Meteors/openframe-core
repo_url: https://github.com/Furious-Meteors/openframe-core
edit_uri: edit/production/docs/

strict: true
docs_dir: docs
site_dir: site

watch:
  - mkdocs.yml
  - docs

# ── Theme ──────────────────────────────────────────────────────────────────
theme:
  name: material
  language: en
  favicon: assets/images/favicon.png
  logo: assets/images/openframe-logo-light.png
  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# ── Plugins ────────────────────────────────────────────────────────────────
plugins:
  - search:
      separator: '[\s\-\.]+'
  - tags
  - include-markdown

# ── Markdown Extensions ────────────────────────────────────────────────────
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ── Extra ──────────────────────────────────────────────────────────────────
extra:
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Furious-Meteors/openframe-core
      name: openframe-core on GitHub

copyright: Copyright &copy; 2026 Furious Meteors Engineering

