[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-core"
version = "1.0.0"
description = "OpenFrame Microservice Suite — core SDK. Ports, tracing, telemetry, exceptions, config."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["openframe", "hexagonal", "microservice", "fastapi", "modal", "opentelemetry"]
dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-semantic-conventions>=0.45b0",
    "opentelemetry-instrumentation-logging>=0.45b0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
