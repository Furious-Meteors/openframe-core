name: Build & Publish Python Package

# Triggers on every push to production (i.e. after a PR is merged).
# Runs the full test suite first; publish is blocked until all tests pass.
on:
  push:
    branches:
      - production

jobs:
  # ── 1. Gate: full test suite must pass before anything is published ──────
  test:
    name: Run Test Suite
    uses: ./.github/workflows/app-test.yml

  # ── 2. Build the wheel and sdist ────────────────────────────────────────
  build:
    name: Build Distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          fetch-depth: 2   # needs at least 2 commits for HEAD~1 to exist

  # ── 3. Publish to PyPI ──────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Restrict to the production branch only — belt-and-suspenders guard
    # so an accidental workflow_dispatch on dev cannot publish.
    if: github.ref == 'refs/heads/production'

    # PyPI Trusted Publishing (OIDC) — no long-lived API token required.
    # Configure at: https://pypi.org/manage/project/openframe-core/settings/publishing/
    # Add a publisher with:
    #   Owner:    <your GitHub org/user>
    #   Repo:     openframe-core
    #   Workflow: python-build.yml
    #   Env:      pypi
    environment:
      name: pypi
      url: https://pypi.org/p/openframe-core

    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Phase 1 (new package): PYPI_API_TOKEN org secret present → token auth.
      # Phase 2 (established package): trusted publisher configured on PyPI →
      #   OIDC auth; the action ignores the token once OIDC takes precedence.
      # Same workflow file, no edits needed when transitioning between phases.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
