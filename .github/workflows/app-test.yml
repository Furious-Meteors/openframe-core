name: App Testing

on:
  pull_request:
    branches:
      - dev
      - production

  # Callable from other workflows (e.g. python-build.yml runs tests before publish).
  workflow_call:

jobs:
  test:
    name: Pytest — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      # false: run all versions even if one fails — see the full compatibility picture.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true   # required if 3.14 is still RC on the runner
          cache: pip

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install test dependencies
        run: pip install -r .github/requirements/test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
