[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-core"
version = "1.0.1"
description = "OpenFrame Microservice Suite - core SDK. Ports, tracing, telemetry, exceptions, config."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = [
    "openframe",
    "hexagonal",
    "microservice",
    "fastapi",
    "modal",
    "opentelemetry",
    "ports-and-adapters",
    "clean-architecture",
    "asgi",
    "tracing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Distributed Computing",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

# dependencies must come before [project.urls]
dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-semantic-conventions>=0.45b0",
    "opentelemetry-instrumentation-logging>=0.45b0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=10.14,<11",
    "mkdocstrings[python]>=0.29,<1",
    "mkdocs-include-markdown-plugin>=7.0,<8",
]
docs-dev = [
    "openframe-core[docs]",
    "playwright>=1.52,<2",
    "ruff>=0.11,<1",
]

[[project.authors]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[[project.maintainers]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-core"
Documentation = "https://furious-meteors.github.io/openframe-core/"
Repository    = "https://github.com/Furious-Meteors/openframe-core"
Changelog     = "https://github.com/Furious-Meteors/openframe-core/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]